services:
  - type: web
    name: trendlab-api
    runtime: node
    plan: free
    buildCommand: node --check backend/auth.js && node --check backend/server.js
    startCommand: npm run backend
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "24.22.3"
      - key: JWT_SECRET
        generateValue: true
